<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration | Jershon Vinodh</title>
    
    <!-- Clean .html from the URL bar automatically on load -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            window.history.replaceState(null, null, newPath + window.location.search + window.location.hash);
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Embedded Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d12;
            color: #e1e1e6;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .site-header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background-color: rgba(11, 13, 18, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .site-header .container {
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo span {
            color: #818cf8;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .btn-outline {
            border: 1px solid rgba(129, 140, 248, 0.4);
            padding: 8px 18px;
            border-radius: 6px;
            color: #ffffff !important;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            background-color: rgba(129, 140, 248, 0.1);
            border-color: #818cf8;
        }

        /* Registration Section */
        .register-section {
            padding: 80px 0;
            flex: 1;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h1 {
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }

        .section-title h1 span {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title p {
            color: #94a3b8;
            font-size: 1.05rem;
        }

        .register-card {
            background-color: #12151d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background-color: #0b0d12;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #818cf8;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.2);
        }

        /* Checkbox styling for confirmation */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            background-color: rgba(255, 255, 255, 0.02);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .checkbox-group label {
            color: #e1e1e6;
            font-size: 0.95rem;
            margin-bottom: 0;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: block;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            margin-top: 30px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
        }

        /* Footer */
        .site-footer {
            padding: 40px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            background-color: #08090d;
        }

        @media (max-width: 768px) {
            .register-card {
                padding: 25px;
            }
            .section-title h1 {
                font-size: 2.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <header class="site-header">
        <div class="container">
            <a href="/motivationalspeaking/" class="logo">Jershon <span>Vinodh</span></a>
            <nav class="nav-links">
                <a href="/motivationalspeaking/#events">Seminars</a>
                <a href="/motivationalspeaking/about">About</a>
                <a href="/motivationalspeaking/contact" class="btn-outline">Get in Touch</a>
            </nav>
        </div>
    </header>

    <!-- Main Registration Section -->
    <main class="register-section">
        <div class="container">
            <div class="section-title">
                <h1>Seminar <span>Registration</span></h1>
                <p>Secure your spot for upcoming speaking engagements and events.</p>
            </div>

            <div class="register-card">
                <form action="https://formspree.io/f/xnpallvj" method="POST">
                    
                    <!-- Full Name Field -->
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="Full Name" class="form-control" placeholder="Enter your full name" required>
                    </div>

                    <!-- Phone Number Field -->
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="Phone Number" class="form-control" placeholder="Enter your phone number" required>
                    </div>

                    <!-- Number of Attendees Field -->
                    <div class="form-group">
                        <label for="attendees">Number of Attendees</label>
                        <input type="number" id="attendees" name="Number of Attendees" class="form-control" value="1" min="1" max="50" required>
                        <small style="color: #64748b; display: block; margin-top: 6px;">Enter 1 for an individual ticket, or more if registering as a group.</small>
                    </div>

                    <!-- Confirmation Checkbox -->
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="confirm" name="Confirmed Attendance" value="Yes" required>
                            <label for="confirm">Yes, I confirm my attendance and registration details.</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Complete Registration</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Jershon Vinodh Seminars. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
