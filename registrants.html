<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registrants | Jershon Vinodh</title>
    
    <!-- Clean .html from URL bar -->
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            window.history.replaceState(null, null, newPath + window.location.search + window.location.hash);
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Embedded Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d12;
            color: #e1e1e6;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .site-header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background-color: rgba(11, 13, 18, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .site-header .container {
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo span {
            color: #818cf8;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .btn-outline {
            border: 1px solid rgba(129, 140, 248, 0.4);
            padding: 8px 18px;
            border-radius: 6px;
            color: #ffffff !important;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            background-color: rgba(129, 140, 248, 0.1);
            border-color: #818cf8;
        }

        /* Main Section */
        .directory-section {
            padding: 80px 0;
            flex: 1;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h1 {
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }

        .section-title h1 span {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title p {
            color: #94a3b8;
            font-size: 1.05rem;
        }

        /* Event Group Cards */
        .event-group-card {
            background-color: #12151d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .event-header h3 {
            font-size: 1.35rem;
            color: #ffffff;
            font-weight: 700;
        }

        .badge {
            background: rgba(129, 140, 248, 0.15);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Table Design */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        th {
            color: #94a3b8;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #e1e1e6;
        }

        .no-registrants {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-style: italic;
        }

        .loading-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
        }

        /* Footer */
        .site-footer {
            padding: 40px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            background-color: #08090d;
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <header class="site-header">
        <div class="container">
            <a href="/motivationalspeaking/" class="logo">Jershon <span>Vinodh</span></a>
            <nav class="nav-links">
                <a href="/motivationalspeaking/#events">Seminars</a>
                <a href="/motivationalspeaking/about">About</a>
                <a href="/motivationalspeaking/registrants" style="color: #ffffff;">View Attendees</a>
                <a href="/motivationalspeaking/contact" class="btn-outline">Get in Touch</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="directory-section">
        <div class="container">
            <div class="section-title">
                <h1>Registrants <span>Directory</span></h1>
                <p>Publicly view live headcounts and attendee lists for upcoming events.</p>
            </div>

            <div id="directoryContent">
                <div class="loading-state">Loading registered attendees...</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Jershon Vinodh Seminars. All rights reserved.</p>
        </div>
    </footer>

    <!-- Script to pull data and organize by event -->
    <script>
        // Manually maintained list of current events (update this array as your events change)
        const currentEvents = [
            "Unstoppable Mindset Keynote",
            "Student Leadership Masterclass",
            "The Power of Resilience Workshop"
        ];

        async function fetchRegistrants() {
            const container = document.getElementById('directoryContent');
            
            try {
                renderDirectory();
            } catch (error) {
                container.innerHTML = '<div class="no-registrants">Unable to load directory at this moment.</div>';
            }
        }

        function renderDirectory() {
            const container = document.getElementById('directoryContent');
            
            // Pull stored entries from shared browser storage
            let registrations = JSON.parse(localStorage.getItem('jv_registrations')) || [];

            container.innerHTML = '';

            currentEvents.forEach(eventTitle => {
                // Filter registrations belonging to this specific event
                const eventRegs = registrations.filter(r => r.seminar === eventTitle);
                
                // Calculate total headcounts
                let totalAttendees = 0;
                eventRegs.forEach(r => {
                    totalAttendees += parseInt(r.attendees || 1);
                });

                let rowsHTML = '';
                if (eventRegs.length > 0) {
                    eventRegs.forEach(reg => {
                        rowsHTML += `
                            <tr>
                                <td>${escapeHtml(reg.name)}</td>
                                <td>${escapeHtml(reg.phone)}</td>
                                <td>${reg.attendees || 1}</td>
                            </tr>
                        `;
                    });
                } else {
                    rowsHTML = `<tr><td colspan="3" class="no-registrants">No registrations yet for this event.</td></tr>`;
                }

                container.innerHTML += `
                    <div class="event-group-card">
                        <div class="event-header">
                            <h3>${escapeHtml(eventTitle)}</h3>
                            <div class="badge">Total Attendees: ${totalAttendees}</div>
                        </div>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Full Name</th>
                                        <th>Phone Number</th>
                                        <th>Attendees</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHTML}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
        }

        // Security helper to prevent HTML injection
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Automatically trigger data load when the page opens
        window.addEventListener('DOMContentLoaded', fetchRegistrants);
    </script>
</body>
</html>
