<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Jershon Vinodh</title>
    
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            window.history.replaceState(null, null, newPath + window.location.search + window.location.hash);
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d12;
            color: #e1e1e6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: #12151d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .login-card h2 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-card h2 span {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .form-control {
            width: 100%;
            background-color: #0b0d12;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #818cf8; }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        .btn-primary:hover { opacity: 0.9; }
        .error-msg { color: #f87171; font-size: 0.85rem; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin <span>Portal</span></h2>
        <p>Enter your password to manage events and signups.</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary">Login to Dashboard</button>
            <div id="errorMsg" class="error-msg">Incorrect password. Please try again.</div>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            
            // Set your secure admin password here
            if (pass === "jershonadmin2026") {
                localStorage.setItem('jv_admin_logged_in', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
